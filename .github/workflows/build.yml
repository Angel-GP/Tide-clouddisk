name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PanManager --icon app.ico --add-data "web;web" gui.py

      - name: Rename artifact
        shell: pwsh
        run: Rename-Item -Path dist\PanManager.exe -NewName "网盘管理器.exe"

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          Tide cloud 网盘管理器 Windows 单文件版(免 Python 环境)

          - 双击即用, 配置与上传文件保存在 exe 同目录
          - 支持局域网共享与公网服务器部署
          - 多账号权限 / 文件夹浏览 / 媒体在线预览 / 隐藏文件
          - 自定义前端文案 / 列表与浏览双视图 / 悬停预览
          - 窗口图标内置, 无需附加文件
          - 由 GitHub Actions 自动构建
          "@ | Out-File -Encoding utf8 release_notes.md

      - name: Create Release (tag 推送时)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "dist\网盘管理器.exe" --title "Tide cloud 网盘管理器 ${{ github.ref_name }}" --notes-file release_notes.md

      - name: Upload artifact (手动运行时可下载)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tide-cloud-manager
          path: dist\网盘管理器.exe
