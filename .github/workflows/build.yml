name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (3.9, 与本地验证过的构建环境一致)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PyInstaller (锁定 6.22.0) 与 pystray
        run: python -m pip install pyinstaller==6.22.0 pystray

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PanManager --icon app.ico --add-data "web;web" gui.py

      - name: Rename artifact
        shell: pwsh
        run: |
          $exeName = "Tide" + [char]32 + "cloud.exe"   # 空格用字符码显式拼接, 防止任何解析变形
          Rename-Item -Path dist\PanManager.exe -NewName $exeName
          "ASSET_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write release notes
        shell: pwsh
        run: |
          $changes = git log --no-merges --oneline -8 HEAD
          @"
          Tide cloud Windows 单文件版(免 Python 环境)

          ## 本次更新 (修复/变更)
          $($changes -join "`n")

          ## 说明
          - 双击即用, 配置与上传文件保存在 exe 同目录
          - 支持局域网共享与公网服务器部署
          - 多账号权限 / 文件夹浏览 / 媒体在线预览 / 隐藏文件
          - 自定义前端文案 / 列表与浏览双视图 / 悬停预览
          - 由 GitHub Actions 自动构建

          > 提示: 若 Windows 提示"已保护你的电脑", 请点击「更多信息」→「仍要运行」。
          > 未签名程序被 SmartScreen 拦截属正常现象。
          "@ | Out-File -Encoding utf8 release_notes.md

      - name: Create Release and upload (REST API)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = Get-Content release_notes.md -Raw -Encoding UTF8
          $body = @{
            tag_name = "${{ github.ref_name }}"
            name = "Tide cloud ${{ github.ref_name }}"
            body = $notes
          } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "actions-build" }
          $rel = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/Angel-GP/Tide-clouddisk/releases" -Headers $headers -ContentType "application/json; charset=utf-8" -Body $body
          # 资产上传改用 curl 直传 + 硬编码 %20, 不经过 PowerShell 的 URI 重编码 (避免空格被变形)
          $asset = Join-Path "dist" $env:ASSET_NAME
          $url = "https://uploads.github.com/repos/Angel-GP/Tide-clouddisk/releases/$($rel.id)/assets?name=Tide%20cloud.exe"
          curl.exe -sS -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$asset" "$url"

      - name: Upload artifact (手动运行时可下载)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tide-cloud-manager
          path: dist\Tide cloud.exe
